<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- UssamaEditing mark: a gold U whose left stem is sliced by an editing cut, with a play head in its bowl. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe39a"/>
      <stop offset="0.45" stop-color="#e3b341"/>
      <stop offset="1" stop-color="#a8781c"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151006"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- the cut: a diagonal slice through the left stem -->
      <path d="M180 470 L470 390 L470 436 L180 516 Z" fill="#000"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <rect x="66" y="66" width="892" height="892" rx="208" fill="none" stroke="#e3b341" stroke-opacity="0.35" stroke-width="4"/>
  <path mask="url(#cut)" d="M268 232 H408 V560 A104 104 0 0 0 616 560 V232 H756 V560 A244 244 0 0 1 268 560 Z" fill="url(#gold)"/>
  <path d="M470 492 L586 560 L470 628 Z" fill="url(#gold)"/>
  <rect x="268" y="800" width="488" height="14" rx="7" fill="#e3b341" fill-opacity="0.35"/>
  <rect x="268" y="800" width="196" height="14" rx="7" fill="url(#gold)"/>
  <circle cx="464" cy="807" r="20" fill="#fbe39a"/>
</svg>
